<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Global Immigration SC</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-red: #E30613;
            --primary-red-dark: #b30000;
            --primary-white: #FFFFFF;
            --dark-gray: #333333;
            --medium-gray: #777777;
            --success-green: #28a745;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            background-attachment: fixed;
        }

        .login-container {
            max-width: 450px;
            width: 100%;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header img {
            max-width: 120px;
            margin-bottom: 15px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .login-header h2 {
            color: white;
            margin-bottom: 5px;
            font-size: 1.6rem;
        }

        .login-header p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: white;
            font-size: 0.9rem;
        }

        .form-group label i {
            color: var(--primary-red);
            margin-right: 5px;
        }

        .glass-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            font-size: 1rem;
            transition: all 0.3s ease;
            color: var(--dark-gray);
        }

        .glass-input:focus {
            outline: none;
            border-color: var(--primary-red);
            box-shadow: 0 0 0 3px rgba(227, 6, 19, 0.15);
        }

        .glass-input::placeholder {
            color: #999;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .form-options label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.85rem;
            cursor: pointer;
        }

        .form-options label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary-red);
            cursor: pointer;
        }

        .form-options a {
            color: var(--primary-red);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.3s ease;
        }

        .form-options a:hover {
            color: #ff4444;
            text-decoration: underline;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: var(--primary-red);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary:hover {
            background: var(--primary-red-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(227, 6, 19, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background: rgba(227, 6, 19, 0.15);
            border-left: 3px solid var(--primary-red);
            color: var(--primary-red);
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-size: 0.85rem;
        }

        .error-message i {
            margin-right: 8px;
        }

        .login-footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .login-footer p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.85rem;
            margin-bottom: 5px;
        }

        .login-footer a {
            color: var(--primary-red);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .login-footer a:hover {
            color: #ff4444;
            text-decoration: underline;
        }

        .login-footer .back-home {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8rem;
        }

        .login-footer .back-home:hover {
            color: rgba(255, 255, 255, 0.8);
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s linear infinite;
        }

        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 380px;
        }

        .toast {
            background: rgba(30, 30, 60, 0.95);
            backdrop-filter: blur(10px);
            padding: 12px 18px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border-left: 4px solid var(--success-green);
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideInRight 0.4s ease;
            min-width: 250px;
            color: white;
        }
        .toast.error { border-left-color: #dc3545; }
        .toast.info { border-left-color: #17a2b8; }

        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 550px) {
            .login-container {
                padding: 25px;
            }
            .login-header h2 {
                font-size: 1.3rem;
            }
            .form-options {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <img src="../GISC-LOGO.webp" alt="Global Immigration SC Logo" onerror="this.src='https://placehold.co/120x120/E30613/white?text=GISC'">
            <h2>Welcome Back</h2>
            <p>Login to access your immigration portal</p>
        </div>
        
        <div id="errorMessage" class="error-message">
            <i class="fas fa-exclamation-circle"></i> <span id="errorText">Invalid email or password</span>
        </div>
        
        <form id="loginForm">
            <div class="form-group">
                <label><i class="fas fa-envelope"></i> Email Address</label>
                <input type="email" id="email" class="glass-input" placeholder="you@example.com" required autocomplete="email">
            </div>
            
            <div class="form-group">
                <label><i class="fas fa-lock"></i> Password</label>
                <input type="password" id="password" class="glass-input" placeholder="••••••••" required autocomplete="current-password">
            </div>
            
            <div class="form-options">
                <label>
                    <input type="checkbox" id="rememberMe"> Remember me
                </label>
                <a href="forgot-password.html">Forgot Password?</a>
            </div>
            
            <button type="submit" class="btn-primary" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i> Login to Dashboard
            </button>
        </form>
        
        <div class="login-footer">
            <p>Don't have an account? <a href="register.html">Create Account</a></p>
            <p style="margin-top: 8px;">
                <a href="../index.html" class="back-home">← Back to Home</a>
            </p>
            <p style="margin-top: 12px; font-size: 0.7rem; color: rgba(255,255,255,0.3);">
                © 2024 Global Immigration SC
            </p>
        </div>
    </div>

    <!-- Security -->
    <script>
        document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12') { e.preventDefault(); return false; }
            if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i')) { e.preventDefault(); return false; }
            if (e.ctrlKey && e.shiftKey && (e.key === 'J' || e.key === 'j')) { e.preventDefault(); return false; }
            if (e.ctrlKey && (e.key === 'U' || e.key === 'u')) { e.preventDefault(); return false; }
            if (e.ctrlKey && (e.key === 'S' || e.key === 's')) { e.preventDefault(); return false; }
        });
        if (window.location.hostname !== 'localhost' && !window.location.hostname.includes('127.0.0.1')) {
            console.log = function() {};
            console.warn = function() {};
            console.error = function() {};
            console.info = function() {};
            console.debug = function() {};
        }
        console.clear = function() {};
    </script>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <script>
        // ============================================================
        // FIREBASE CONFIGURATION
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyAJ3p91t83EQeQ6XopPfvisc1fIdsWIMm8",
            authDomain: "global-immigration-sc.firebaseapp.com",
            projectId: "global-immigration-sc",
            storageBucket: "global-immigration-sc.firebasestorage.app",
            messagingSenderId: "791181145117",
            appId: "1:791181145117:web:527b7df63c9a32adf9c2f4"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ============================================================
        // API CONFIGURATION
        // ============================================================
        const API_URL = 'https://gisc-app-production.up.railway.app/api';

        // ============================================================
        // TOAST NOTIFICATIONS
        // ============================================================
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer') || (() => {
                const c = document.createElement('div');
                c.id = 'toastContainer';
                c.className = 'toast-container';
                document.body.appendChild(c);
                return c;
            })();

            const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', info: 'fa-info-circle' };
            const colors = { success: '#28a745', error: '#dc3545', info: '#17a2b8' };

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<i class="fas ${icons[type] || 'fa-info-circle'}" style="color: ${colors[type] || '#28a745'};"></i><span>${message}</span><button class="toast-close">&times;</button>`;

            toast.querySelector('.toast-close').addEventListener('click', () => {
                toast.style.animation = 'slideOutRight 0.3s ease forwards';
                setTimeout(() => toast.remove(), 300);
            });

            container.appendChild(toast);
            setTimeout(() => {
                if (toast.parentNode) {
                    toast.style.animation = 'slideOutRight 0.3s ease forwards';
                    setTimeout(() => toast.remove(), 300);
                }
            }, 4000);
        }

        // ============================================================
        // MONGODB LOGIN FUNCTION
        // ============================================================
        async function loginWithMongoDB(email, password) {
            try {
                const response = await fetch(`${API_URL}/users/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.message || 'MongoDB login failed');
                }

                const data = await response.json();
                return data;
            } catch (error) {
                console.error('MongoDB login error:', error);
                throw error;
            }
        }

        // ============================================================
        // CHECK IF ALREADY LOGGED IN (BOTH Firebase AND MongoDB)
        // ============================================================
        function checkExistingLogin() {
            // Check for MongoDB token
            const mongoToken = localStorage.getItem('userToken');
            const userData = localStorage.getItem('userData');
            
            if (mongoToken && userData) {
                try {
                    const user = JSON.parse(userData);
                    // Redirect based on user type
                    if (user.userType === 'admin') {
                        window.location.href = '../admin/dashboard.html';
                    } else if (user.userType === 'agent') {
                        window.location.href = 'agent-dashboard.html';
                    } else {
                        window.location.href = 'dashboard.html';
                    }
                    return true;
                } catch (e) {
                    console.error('Error checking existing login:', e);
                }
            }
            return false;
        }

        // Check for existing login first
        if (!checkExistingLogin()) {
            // Then check Firebase
            auth.onAuthStateChanged((user) => {
                if (user) {
                    db.collection('users').doc(user.uid).get().then((doc) => {
                        if (doc.exists && doc.data().userType === 'admin') {
                            window.location.href = '../admin/dashboard.html';
                        } else {
                            window.location.href = 'dashboard.html';
                        }
                    }).catch(() => {
                        window.location.href = 'dashboard.html';
                    });
                }
            });
        }

        // ============================================================
        // LOGIN FORM HANDLER
        // ============================================================
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const rememberMe = document.getElementById('rememberMe').checked;
            const errorDiv = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            const submitBtn = document.getElementById('loginBtn');
            
            errorDiv.style.display = 'none';
            
            if (!email || !password) {
                errorText.textContent = 'Please enter both email and password';
                errorDiv.style.display = 'block';
                return;
            }
            
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<span class="spinner"></span> Logging in...';
            submitBtn.disabled = true;
            
            try {
                let loginMethod = 'firebase';
                let userData = null;

                // STEP 1: Try Firebase first
                try {
                    const userCredential = await auth.signInWithEmailAndPassword(email, password);
                    const user = userCredential.user;
                    
                    await auth.setPersistence(
                        rememberMe ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION
                    );
                    
                    const userDoc = await db.collection('users').doc(user.uid).get();
                    if (userDoc.exists) {
                        userData = userDoc.data();
                    }
                    
                    loginMethod = 'firebase';
                } catch (firebaseError) {
                    // If Firebase fails with user-not-found, try MongoDB
                    if (firebaseError.code === 'auth/user-not-found' || 
                        firebaseError.code === 'auth/wrong-password' ||
                        firebaseError.code === 'auth/invalid-login-credentials') {
                        
                        console.log('Firebase login failed, trying MongoDB...');
                        
                        const mongoResult = await loginWithMongoDB(email, password);
                        
                        if (mongoResult.success && mongoResult.user) {
                            userData = mongoResult.user;
                            loginMethod = 'mongodb';
                            
                            // Store MongoDB credentials
                            const userInfo = {
                                uid: userData.uid || userData._id,
                                name: userData.name || userData.fullName || 'User',
                                email: userData.email,
                                userType: userData.userType || 'applicant',
                                mongoUser: true
                            };
                            
                            localStorage.setItem('userData', JSON.stringify(userInfo));
                            if (mongoResult.token) {
                                localStorage.setItem('userToken', mongoResult.token);
                            }
                            
                            // Redirect based on user type
                            if (userData.userType === 'admin') {
                                window.location.href = '../admin/dashboard.html';
                            } else if (userData.userType === 'agent') {
                                window.location.href = 'agent-dashboard.html';
                            } else {
                                window.location.href = 'dashboard.html';
                            }
                            return;
                        } else {
                            throw new Error(mongoResult.message || 'MongoDB login failed');
                        }
                    } else {
                        throw firebaseError;
                    }
                }

                // STEP 2: Handle Firebase login success
                if (loginMethod === 'firebase' && userData) {
                    if (userData.userType === 'admin') {
                        window.location.href = '../admin/dashboard.html';
                    } else {
                        window.location.href = 'dashboard.html';
                    }
                }

            } catch (error) {
                console.error('Login error:', error);
                
                let message = 'Login failed. Please try again.';
                if (error.message) {
                    message = error.message;
                } else {
                    switch (error.code) {
                        case 'auth/user-not-found':
                            message = 'No account found with this email address';
                            break;
                        case 'auth/wrong-password':
                            message = 'Incorrect password. Please try again.';
                            break;
                        case 'auth/invalid-email':
                            message = 'Please enter a valid email address.';
                            break;
                        case 'auth/user-disabled':
                            message = 'This account has been disabled. Please contact support.';
                            break;
                        case 'auth/too-many-requests':
                            message = 'Too many failed attempts. Please try again later.';
                            break;
                        default:
                            message = error.message || 'Login failed. Please try again.';
                    }
                }
                
                errorText.textContent = message;
                errorDiv.style.display = 'block';
                showToast(message, 'error');
            } finally {
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        });

        // ============================================================
        // ENTER KEY SUPPORT
        // ============================================================
        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
