    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script>
        // ============================================================
        // CONFIGURATION
        // ============================================================
        const API_URL = 'https://gisc-app-production.up.railway.app/api';

        // ============================================================
        // ADMIN AUTHENTICATION - JWT ONLY
        // ============================================================
        const adminToken = localStorage.getItem('adminToken');
        const adminData = localStorage.getItem('adminData');

        if (!adminToken || !adminData) {
            window.location.href = 'login.html';
        }

        let adminUser = null;
        try {
            adminUser = JSON.parse(adminData);
            document.getElementById('adminName').textContent = adminUser.name || 'Admin';
            document.getElementById('adminAvatar').textContent = (adminUser.name || 'A')[0].toUpperCase();
            document.getElementById('adminRole').textContent = adminUser.role || 'Administrator';
            console.log('✅ Admin logged in:', adminUser.email);
        } catch (e) {
            console.error('Error parsing admin data:', e);
            window.location.href = 'login.html';
        }

        // ============================================================
        // API HELPER WITH BETTER ERROR HANDLING
        // ============================================================
        async function apiFetch(endpoint, options = {}) {
            try {
                const response = await fetch(`${API_URL}/admin/${endpoint}`, {
                    ...options,
                    headers: {
                        'Authorization': `Bearer ${adminToken}`,
                        'Content-Type': 'application/json',
                        ...(options.headers || {})
                    }
                });
                
                // Check if response is JSON
                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    const text = await response.text();
                    console.error(`⚠️ API returned non-JSON for ${endpoint}:`, text.substring(0, 200));
                    throw new Error(`Server returned HTML (${response.status}). The endpoint may not exist.`);
                }
                
                if (!response.ok) {
                    const error = await response.json().catch(() => ({ message: `HTTP ${response.status}` }));
                    throw new Error(error.message || `API error ${response.status}`);
                }
                
                return response.json();
            } catch (error) {
                console.error(`❌ API fetch error for ${endpoint}:`, error.message);
                throw error;
            }
        }

        // ============================================================
        // LOGOUT
        // ============================================================
        document.getElementById('logoutBtn').addEventListener('click', function() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('adminToken');
                localStorage.removeItem('adminData');
                window.location.href = 'login.html';
            }
        });

        // ============================================================
        // NAVIGATION
        // ============================================================
        document.querySelectorAll('.sidebar-nav a').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                const section = this.dataset.section;

                document.querySelectorAll('.sidebar-nav a').forEach(l => l.classList.remove('active'));
                this.classList.add('active');

                document.querySelectorAll('.admin-section').forEach(s => s.classList.remove('active'));

                if (targetSection) targetSection.classList.add('active');

                    'applications': loadApplications,
                    'contacts': loadContacts,
                    'blog': loadBlogPosts,
                    'notifications': loadNotifications,
                    'payments': loadPayments,

                    'scholarships': loadScholarships,
                    'universities': loadUniversities,
                    'programmes': loadProgrammes,

            });

        // MOBILE MENU
        // ============================================================

        // ============================================================
        // LOAD DASHBOARD DATA
        // ============================================================
        async function loadDashboardData() {
            try {
                // Try to load each endpoint with fallback

                let apps = { applications: [] };
                let blogs = { blogs: [] };
                let contacts = { contacts: [] };
                let notifications = { notifications: [] };
                let opportunities = { opportunities: [] };
                let scholarships = { scholarships: [] };
                
                try { users = await apiFetch('users'); } catch(e) { console.warn('Users load failed:', e.message); }
                try { apps = await apiFetch('applications'); } catch(e) { console.warn('Applications load failed:', e.message); }
                try { blogs = await apiFetch('blogs'); } catch(e) { console.warn('Blogs load failed:', e.message); }
                try { contacts = await apiFetch('contacts'); } catch(e) { console.warn('Contacts load failed:', e.message); }
                try { notifications = await apiFetch('notifications'); } catch(e) { console.warn('Notifications load failed:', e.message); }
                try { opportunities = await apiFetch('opportunities'); } catch(e) { console.warn('Opportunities load failed:', e.message); }

                const appsList = apps.applications || [];
                const blogsList = blogs.blogs || [];
                const contactsList = contacts.contacts || [];
                const notifsList = notifications.notifications || [];
                const oppsList = opportunities.opportunities || [];
                const schsList = scholarships.scholarships || [];

                const totalUsers = usersList.length;
                const totalApps = appsList.length;
                const pendingApps = appsList.filter(d => {
                    const status = d.status || 'draft';
                    return status === 'pending' || status === 'draft' || status === 'submitted' || status === 'pending_review';
                }).length;
                const approvedApps = appsList.filter(d => d.status === 'approved').length;
                const totalBlogs = blogsList.length;
                const totalContacts = contactsList.length;

                document.getElementById('totalUsers').textContent = totalUsers;
                document.getElementById('totalApps').textContent = totalApps;
                document.getElementById('pendingApps').textContent = pendingApps;
                document.getElementById('pendingAppsCount').textContent = pendingApps;
                document.getElementById('approvedApps').textContent = approvedApps;
                document.getElementById('totalBlogs').textContent = totalBlogs;
                document.getElementById('blogCount').textContent = totalBlogs;
                document.getElementById('totalContacts').textContent = totalContacts;
                document.getElementById('contactCount').textContent = totalContacts;
                document.getElementById('userCountBadge').textContent = totalUsers;
                document.getElementById('notificationCount').textContent = notifsList.length;
                document.getElementById('totalOpportunities').textContent = oppsList.length;
                document.getElementById('totalScholarships').textContent = schsList.length;
                document.getElementById('oppCount').textContent = oppsList.length;
                document.getElementById('scholarshipCount').textContent = schsList.length;

                // Contact badge
                const newContacts = contactsList.filter(c => c.status === 'new').length;
                const contactBadge = document.querySelector('.sidebar-nav a[data-section="contacts"] .badge');
                if (contactBadge) {
                    if (newContacts > 0) {
                        contactBadge.textContent = newContacts;
                        contactBadge.style.background = '#dc3545';
                        contactBadge.style.color = 'white';
                    } else {
                        contactBadge.textContent = totalContacts || '0';
                        contactBadge.style.background = 'var(--primary-red)';
                        contactBadge.style.color = 'white';
                    }
                }

                if (newContacts > 0) {
                    showToast(`📩 ${newContacts} new contact submission${newContacts > 1 ? 's' : ''}!`, 'info');
                }

                // Recent activity
                const recentActivity = document.getElementById('recentActivityList');
                const sortedApps = [...appsList]
                    .sort((a, b) => new Date(b.updatedAt || 0) - new Date(a.updatedAt || 0))
                    .slice(0, 10);

                if (sortedApps.length === 0 && notifsList.length === 0 && oppsList.length === 0) {
                    recentActivity.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><p>No recent activity</p></div>';
                } else {
                    let items = [];
                    
                    notifsList.slice(0, 5).forEach(notif => {
                        items.push(`
                            <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.06);">
                                <div>
                                    <strong style="color: white;">📢 ${notif.title}</strong>
                                    <span style="color: rgba(255,255,255,0.5); font-size: 0.8rem;">announcement sent</span>
                                </div>
                                <div style="display: flex; align-items: center; gap: 10px;">
                                    <span class="status-badge status-${notif.priority || 'normal'}">${(notif.priority || 'normal').toUpperCase()}</span>
                                    <span style="color: rgba(255,255,255,0.3); font-size: 0.7rem;">${notif.createdAt ? new Date(notif.createdAt).toLocaleDateString() : 'Just now'}</span>
                                </div>
                            </div>
                        `);
                    });
                    
                    oppsList.slice(0, 3).forEach(opp => {
                        items.push(`
                            <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.06);">
                                <div>
                                    <strong style="color: white;">🌍 ${opp.title || opp.programme}</strong>
                                    <span style="color: rgba(255,255,255,0.5); font-size: 0.8rem;">opportunity ${opp.status === 'published' ? 'published' : 'created'}</span>
                                </div>
                                <div style="display: flex; align-items: center; gap: 10px;">
                                    <span class="status-badge status-${opp.status || 'draft'}">${(opp.status || 'draft').toUpperCase()}</span>
                                    <span style="color: rgba(255,255,255,0.3); font-size: 0.7rem;">${opp.created_at ? new Date(opp.created_at).toLocaleDateString() : 'Just now'}</span>
                                </div>
                            </div>
                        `);
                    });
                    
                    sortedApps.forEach(app => {
                        const name = app.personalInfo?.name || app.name || 'Unknown User';
                        const status = app.status || 'draft';
                        const date = app.updatedAt ? new Date(app.updatedAt).toLocaleDateString() : 'Just now';
                        items.push(`
                            <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.06);">
                                <div>
                                    <strong style="color: white;">${name}</strong>
                                    <span style="color: rgba(255,255,255,0.5); font-size: 0.8rem;">updated application</span>
                                </div>
                                <div style="display: flex; align-items: center; gap: 10px;">
                                    <span class="status-badge status-${status}">${status.toUpperCase()}</span>
                                    <span style="color: rgba(255,255,255,0.3); font-size: 0.7rem;">${date}</span>
                                </div>
                            </div>
                        `);
                    });
                    
                    recentActivity.innerHTML = items.slice(0, 10).join('');
                }

            } catch (error) {
                console.error('Error loading dashboard:', error);
                showToast('Error loading dashboard data: ' + error.message, 'error');
            }
        }

        // ============================================================
        // LOAD SERVICE REQUESTS (FIXED)
        // ============================================================
        let allServiceRequests = [];

        async function loadServiceRequests() {
            const debugEl = document.getElementById('srDebugInfo');
            const container = document.getElementById('serviceRequestsList');
            
            try {
                debugEl.innerHTML = '<span style="color: #ff0;">🔄 Fetching service requests...</span>';
                
                const result = await apiFetch('service-requests');
                allServiceRequests = result.requests || [];
                
                const pending = allServiceRequests.filter(r => r.status === 'pending').length;
                const inReview = allServiceRequests.filter(r => r.status === 'in_review').length;

                const completed = allServiceRequests.filter(r => r.status === 'completed').length;
                const rejected = allServiceRequests.filter(r => r.status === 'rejected').length;
                
                document.getElementById('srPending').textContent = pending;
                document.getElementById('srInReview').textContent = inReview;
                document.getElementById('srApproved').textContent = approved;
                document.getElementById('srCompleted').textContent = completed;
                document.getElementById('srRejected').textContent = rejected;
                document.getElementById('serviceReqTotalLabel').textContent = `${allServiceRequests.length} total`;

                    <span style="color: #0f0;">✅ Found ${allServiceRequests.length} service requests</span>

                        <div class="empty-state">
                            <i class="fas fa-inbox"></i>
                            <p>No service requests yet</p>
                        </div>

                    return;
                }

                container.innerHTML = allServiceRequests.map(req => {
                    const statusClass = 'status-' + req.status;
                    return `
                        <div class="service-request-card" style="padding: 16px 20px; margin-bottom: 12px; border-radius: 12px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08);">
                            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                                <div>
                                    <strong style="color: white; font-size: 1rem;">${req.service_name}</strong>
                                    <span style="color: rgba(255,255,255,0.4); font-size: 0.7rem; margin-left: 10px;">${req.service_category}</span>
                                    <div style="font-size: 0.8rem; color: rgba(255,255,255,0.5); margin-top: 3px;">
                                        ${req.user_name} • ${req.user_email}
                                    </div>
                                </div>
                                <span class="service-status ${statusClass}" style="padding: 4px 12px; border-radius: 20px; font-size: 0.65rem; font-weight: 600; background: ${req.status === 'pending' ? 'rgba(255,193,7,0.2)' : req.status === 'in_review' ? 'rgba(23,162,184,0.2)' : req.status === 'approved' ? 'rgba(40,167,69,0.2)' : req.status === 'completed' ? 'rgba(40,167,69,0.2)' : 'rgba(220,53,69,0.2)'}; color: ${req.status === 'pending' ? '#ffc107' : req.status === 'in_review' ? '#17a2b8' : req.status === 'approved' ? '#28a745' : req.status === 'completed' ? '#28a745' : '#dc3545'};">
                                    ${req.status.replace('_', ' ').toUpperCase()}
                                </span>
                            </div>
                            <p style="color: rgba(255,255,255,0.5); font-size: 0.85rem; margin-top: 8px; padding: 8px 12px; background: rgba(255,255,255,0.05); border-radius: 6px;">
                                ${req.description || 'No description provided'}
                            </p>
                            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 10px;">
                                <small style="color: rgba(255,255,255,0.3); font-size: 0.6rem;">
                                    ${req.created_at ? new Date(req.created_at).toLocaleDateString() : ''}
                                </small>
                                <div style="display: flex; gap: 5px;">
                                    <select onchange="updateServiceRequestStatus('${req._id || req.id}', this.value)" class="glass-input" style="width: auto; padding: 4px 8px; font-size: 0.7rem; min-width: 120px;">
                                        <option value="pending" ${req.status === 'pending' ? 'selected' : ''}>Pending</option>
                                        <option value="in_review" ${req.status === 'in_review' ? 'selected' : ''}>In Review</option>
                                        <option value="approved" ${req.status === 'approved' ? 'selected' : ''}>Approved</option>
                                        <option value="completed" ${req.status === 'completed' ? 'selected' : ''}>Completed</option>
                                        <option value="rejected" ${req.status === 'rejected' ? 'selected' : ''}>Rejected</option>

                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

            editingScholarshipId = null;
            document.getElementById('scholarshipModalTitle').textContent = 'Create New Scholarship';
            document.getElementById('scholarshipForm').reset();
            document.getElementById('scholarshipModal').classList.add('active');
        });

        document.getElementById('closeScholarshipModal').addEventListener('click', closeScholarshipModal);
        document.getElementById('cancelScholarshipBtn').addEventListener('click', closeScholarshipModal);
        document.getElementById('saveScholarshipBtn').addEventListener('click', saveScholarship);

        function closeScholarshipModal() {
            document.getElementById('scholarshipModal').classList.remove('active');
            editingScholarshipId = null;
        }

        document.getElementById('scholarshipModal').addEventListener('click', function(e) {
            if (e.target === this) closeScholarshipModal();
        });

        // University Modal
        document.getElementById('newUniversityBtn').addEventListener('click', () => {
            editingUniId = null;
            document.getElementById('universityModalTitle').textContent = 'Create New University';
            document.getElementById('universityForm').reset();
            document.getElementById('universityModal').classList.add('active');
        });

        document.getElementById('closeUniModal').addEventListener('click', closeUniversityModal);
        document.getElementById('cancelUniBtn').addEventListener('click', closeUniversityModal);
        document.getElementById('saveUniBtn').addEventListener('click', saveUniversity);

        function closeUniversityModal() {
            document.getElementById('universityModal').classList.remove('active');
            editingUniId = null;
        }

        document.getElementById('universityModal').addEventListener('click', function(e) {
            if (e.target === this) closeUniversityModal();
        });

        // Programme Modal
        document.getElementById('newProgrammeBtn').addEventListener('click', () => {
            editingProgId = null;
            document.getElementById('programmeModalTitle').textContent = 'Create New Programme';
            document.getElementById('programmeForm').reset();
            document.getElementById('programmeModal').classList.add('active');
        });

        document.getElementById('closeProgModal').addEventListener('click', closeProgrammeModal);
        document.getElementById('cancelProgBtn').addEventListener('click', closeProgrammeModal);
        document.getElementById('saveProgBtn').addEventListener('click', saveProgramme);

        function closeProgrammeModal() {
            document.getElementById('programmeModal').classList.remove('active');
            editingProgId = null;
        }

        document.getElementById('programmeModal').addEventListener('click', function(e) {
            if (e.target === this) closeProgrammeModal();
        });

        // ============================================================
        // REFRESH DATA
        // ============================================================
        async function refreshData() {
            showToast('Refreshing data...', 'info');
            await loadDashboardData();
            const activeSection = document.querySelector('.admin-section.active');
            if (activeSection) {
                const id = activeSection.id;
                const loaders = {
                    'users-section': loadUsers,
                    'applications-section': loadApplications,
                    'contacts-section': loadContacts,
                    'blog-section': loadBlogPosts,
                    'notifications-section': loadNotifications,
                    'payments-section': loadPayments,
                    'opportunities-section': loadOpportunities,
                    'scholarships-section': loadScholarships,
                    'universities-section': loadUniversities,
                    'programmes-section': loadProgrammes,
                    'service-requests-section': loadServiceRequests
                };
                if (loaders[id]) await loaders[id]();
            }
            showToast('Data refreshed!', 'success');
        }

        // ============================================================
        // TOAST NOTIFICATIONS
        // ============================================================
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer') || (() => {
                const c = document.createElement('div');
                c.id = 'toastContainer';
                c.className = 'toast-container';
                document.body.appendChild(c);
                return c;
            })();

            const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', warning: 'fa-exclamation-triangle', info: 'fa-info-circle' };
            const colors = { success: '#28a745', error: '#dc3545', warning: '#ffc107', info: '#17a2b8' };

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <i class="fas ${icons[type] || 'fa-info-circle'}" style="color: ${colors[type] || '#28a745'};"></i>
                <span>${message}</span>
                <button class="toast-close">&times;</button>
            `;

            toast.querySelector('.toast-close').addEventListener('click', () => {
                toast.style.animation = 'slideOutRight 0.3s ease forwards';
                setTimeout(() => toast.remove(), 300);
            });

            container.appendChild(toast);

            setTimeout(() => {
                if (toast.parentNode) {
                    toast.style.animation = 'slideOutRight 0.3s ease forwards';
                    setTimeout(() => toast.remove(), 300);
                }
            }, 4000);
        }

        // ============================================================
        // KEYBOARD SHORTCUTS
        // ============================================================
        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 'r') { e.preventDefault(); refreshData(); }
            if (e.key === 'Escape') { 
                closeBlogModal();
                closeNotificationModal();
                closeOpportunityModal();
                closeScholarshipModal();
                closeUniversityModal();
                closeProgrammeModal();
                document.getElementById('userDetailModal').classList.remove('active');
                document.getElementById('sidebar').classList.remove('open'); 
            }
        });

        // ============================================================
        // EXPOSE GLOBALLY
        // ============================================================
        window.refreshData = refreshData;
        window.loadUsers = loadUsers;
        window.loadApplications = loadApplications;
        window.loadContacts = loadContacts;
        window.loadBlogPosts = loadBlogPosts;
        window.loadNotifications = loadNotifications;
        window.loadPayments = loadPayments;
        window.loadOpportunities = loadOpportunities;
        window.loadScholarships = loadScholarships;
        window.loadUniversities = loadUniversities;
        window.loadProgrammes = loadProgrammes;
        window.loadServiceRequests = loadServiceRequests;
        window.syncUsers = syncUsers;
        window.createTestUser = createTestUser;
        window.viewUserDetail = viewUserDetail;
        window.viewUser = viewUser;
        window.deleteUser = deleteUser;
        window.viewApplicationDetail = viewApplicationDetail;
        window.updateApplicationStatus = updateApplicationStatus;
        window.editBlogPost = editBlogPost;
        window.deleteBlogPost = deleteBlogPost;
        window.markNotificationRead = markNotificationRead;
        window.deleteNotification = deleteNotification;
        window.confirmPayment = confirmPayment;
        window.rejectPayment = rejectPayment;
        window.markAsPending = markAsPending;
        window.deletePayment = deletePayment;
        window.viewContactDetail = viewContactDetail;
        window.updateContactStatus = updateContactStatus;
        window.updateContactStatusFromModal = updateContactStatusFromModal;
        window.replyToContact = replyToContact;
        window.deleteContact = deleteContact;
        window.editOpportunity = editOpportunity;
        window.deleteOpportunity = deleteOpportunity;
        window.publishOpportunity = publishOpportunity;
        window.unpublishOpportunity = unpublishOpportunity;
        window.editScholarship = editScholarship;
        window.deleteScholarship = deleteScholarship;
        window.editUniversity = editUniversity;
        window.deleteUniversity = deleteUniversity;
        window.editProgramme = editProgramme;
        window.deleteProgramme = deleteProgramme;
        window.updateServiceRequestStatus = updateServiceRequestStatus;
        window.deleteServiceRequest = deleteServiceRequest;

        // ============================================================
        // INITIALIZE
        // ============================================================
        console.log('🚀 Initializing Admin Dashboard 2.0...');
        console.log('👤 Admin:', adminUser?.email);
        console.log('🔗 API URL:', API_URL);
        
        loadDashboardData();
        setTimeout(() => loadUsers(), 500);
        setTimeout(() => loadPayments(), 1000);
        setTimeout(() => loadOpportunities(), 1500);
        
        console.log('✅ Admin Dashboard 2.0 ready');
        console.log('💡 New Features: Opportunities, Scholarships, Universities, Programmes, Service Requests');
    </script>
</body>
