<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Registration - Global Immigration SC</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-red: #E30613;
            --primary-red-dark: #b30000;
            --primary-white: #FFFFFF;
            --dark-gray: #333333;
            --medium-gray: #777777;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            background-attachment: fixed;
        }

        .register-container {
            max-width: 550px;
            width: 100%;
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            max-height: 95vh;
            overflow-y: auto;
        }

        .register-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .register-header img {
            max-width: 80px;
            margin-bottom: 15px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .register-header h2 {
            color: white;
            margin-bottom: 5px;
            font-size: 1.4rem;
        }

        .register-header p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.85rem;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.85rem;
        }

        .form-group label .required {
            color: var(--primary-red);
        }

        .glass-input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            font-size: 0.95rem;
            transition: all 0.3s ease;
            color: var(--dark-gray);
        }

        .glass-input:focus {
            outline: none;
            border-color: var(--primary-red);
            box-shadow: 0 0 0 3px rgba(227, 6, 19, 0.15);
        }

        .glass-input::placeholder {
            color: #999;
        }

        .glass-select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            font-size: 0.95rem;
            transition: all 0.3s ease;
            color: var(--dark-gray);
            appearance: none;
            cursor: pointer;
        }

        .glass-select:focus {
            outline: none;
            border-color: var(--primary-red);
            box-shadow: 0 0 0 3px rgba(227, 6, 19, 0.15);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: var(--primary-red);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary:hover {
            background: var(--primary-red-dark);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(227, 6, 19, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .btn-outline {
            width: 100%;
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            background: transparent;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary-red);
        }

        .error-message {
            background: rgba(227, 6, 19, 0.15);
            border-left: 3px solid var(--primary-red);
            color: #ff6b6b;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
            font-size: 0.85rem;
        }

        .success-message {
            background: rgba(40, 167, 69, 0.15);
            border-left: 3px solid #28a745;
            color: #28a745;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
            font-size: 0.85rem;
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .register-footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .register-footer p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
        }

        .register-footer a {
            color: var(--primary-red);
            text-decoration: none;
            font-weight: 600;
        }

        .register-footer a:hover {
            color: #ff4444;
            text-decoration: underline;
        }

        @media (max-width: 550px) {
            .register-container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-header">
            <img src="../GISC-LOGO.webp" alt="Global Immigration SC Logo" onerror="this.src='https://placehold.co/80x80/E30613/white?text=GISC'">
            <h2>Become a GISC Agent</h2>
            <p>Register to start earning commissions</p>
        </div>
        
        <div id="errorMessage" class="error-message">
            <i class="fas fa-exclamation-circle"></i> <span id="errorText">Error message</span>
        </div>
        
        <div id="successMessage" class="success-message">
            <i class="fas fa-check-circle"></i> <span id="successText">Success message</span>
        </div>
        
        <form id="registerForm">
            <div class="form-group">
                <label>Full Name <span class="required">*</span></label>
                <input type="text" id="fullName" class="glass-input" placeholder="John Doe" required>
            </div>
            
            <div class="form-group">
                <label>Email Address <span class="required">*</span></label>
                <input type="email" id="email" class="glass-input" placeholder="agent@example.com" required>
            </div>
            
            <div class="form-group">
                <label>Phone Number <span class="required">*</span></label>
                <input type="tel" id="phone" class="glass-input" placeholder="+231 770 562 292" required>
            </div>
            
            <div class="form-group">
                <label>Organization / Company</label>
                <input type="text" id="organization" class="glass-input" placeholder="Your organization name">
            </div>
            
            <div class="form-group">
                <label>Location</label>
                <input type="text" id="location" class="glass-input" placeholder="City, Country">
            </div>
            
            <div class="form-group">
                <label>Agent Category <span class="required">*</span></label>
                <select id="agentCategory" class="glass-select" required>
                    <option value="">Select Category</option>
                    <option value="Referral Agent">Referral Agent</option>
                    <option value="Education Counselor">Education Counselor</option>
                    <option value="Senior Counselor">Senior Counselor</option>
                    <option value="Country Representative">Country / Regional Representative</option>
                    <option value="Corporate Referral Partner">Institutional / Corporate Referral Partner</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Professional Background</label>
                <textarea id="professionalBackground" class="glass-input" rows="2" placeholder="Brief description of your experience"></textarea>
            </div>
            
            <div class="form-group">
                <label>Previous Experience</label>
                <textarea id="experience" class="glass-input" rows="2" placeholder="Previous recruitment or consultancy experience"></textarea>
            </div>
            
            <div class="form-group">
                <label>Social Media / Business Info</label>
                <input type="text" id="socialMedia" class="glass-input" placeholder="LinkedIn, Facebook, Website, etc.">
            </div>
            
            <button type="submit" class="btn-primary" id="registerBtn">
                <i class="fas fa-paper-plane"></i> Submit Application
            </button>
        </form>
        
        <div class="register-footer">
            <p>Already have an account? <a href="login.html">Login here</a></p>
            <p style="margin-top: 8px; font-size: 0.75rem; color: rgba(255,255,255,0.3);">
                Your application will be reviewed by GISC Admin
            </p>
        </div>
    </div>
    
    <!-- ============ SECURITY PROTECTION ============ -->
    <script>
        document.addEventListener('contextmenu', function(e) { e.preventDefault(); return false; });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12') { e.preventDefault(); return false; }
            if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i')) { e.preventDefault(); return false; }
            if (e.ctrlKey && e.shiftKey && (e.key === 'J' || e.key === 'j')) { e.preventDefault(); return false; }
            if (e.ctrlKey && (e.key === 'U' || e.key === 'u')) { e.preventDefault(); return false; }
            if (e.ctrlKey && (e.key === 'S' || e.key === 's')) { e.preventDefault(); return false; }
        });
        if (window.location.hostname !== 'localhost' && !window.location.hostname.includes('127.0.0.1')) {
            console.log = function() {};
            console.warn = function() {};
            console.error = function() {};
            console.info = function() {};
            console.debug = function() {};
        }
        console.clear = function() {};
    </script>

    <script>
        // ============================================================
        // CONFIGURATION
        // ============================================================
        const API_URL = 'https://gisc-app-production.up.railway.app/api';

        // ============================================================
        // REGISTRATION FORM HANDLER
        // ============================================================
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const organization = document.getElementById('organization').value.trim();
            const location = document.getElementById('location').value.trim();
            const agentCategory = document.getElementById('agentCategory').value;
            const professionalBackground = document.getElementById('professionalBackground').value.trim();
            const experience = document.getElementById('experience').value.trim();
            const socialMedia = document.getElementById('socialMedia').value.trim();
            
            const errorDiv = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            const successDiv = document.getElementById('successMessage');
            const successText = document.getElementById('successText');
            const submitBtn = document.getElementById('registerBtn');
            
            // Hide previous messages
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            
            // Validation
            if (!fullName || !email || !phone || !agentCategory) {
                errorText.textContent = 'Please fill in all required fields (*)';
                errorDiv.style.display = 'block';
                return;
            }
            
            // Email validation
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                errorText.textContent = 'Please enter a valid email address';
                errorDiv.style.display = 'block';
                return;
            }
            
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<span class="spinner"></span> Submitting...';
            submitBtn.disabled = true;
            
            try {
                const response = await fetch(`${API_URL}/agent/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        fullName,
                        email,
                        phone,
                        organization,
                        location,
                        agentCategory,
                        professionalBackground,
                        experience,
                        socialMedia
                    })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.message || 'Registration failed');
                }
                
                if (!data.success) {
                    throw new Error(data.message || 'Registration failed');
                }
                
                // Show success
                successText.textContent = `✅ Registration submitted! Your Agent ID: ${data.agentId}. Please check your email for further instructions.`;
                successDiv.style.display = 'block';
                
                // Reset form
                document.getElementById('registerForm').reset();
                
                // Scroll to success message
                successDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
                
            } catch (error) {
                console.error('Registration error:', error);
                errorText.textContent = error.message || 'Registration failed. Please try again.';
                errorDiv.style.display = 'block';
            } finally {
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
